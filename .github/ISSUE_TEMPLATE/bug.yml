name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the smallest reproducible example and relevant context.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include platform, version, and other details that affect reproduction.
